<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Scores</title>
  <meta name="description" content="Scores originaux, musique de film, scene et campagnes par Marco Charlas-Hou." />
  <link rel="stylesheet" href="/style.css?v=0.5.0" />
  <link rel="stylesheet" href="/assets/css/model-page.css?v=0.5.5" />
  <link rel="stylesheet" href="/assets/css/marco-bg-veil.css?v=0.5.5" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page inner scores" data-page="scores" data-bg="scores" data-theme="projects" data-transition-label="SCORES">
        <div class="photo-bg" aria-hidden="true"></div>
        <div class="film-sweep" aria-hidden="true"></div>

        <div class="title-wrap" aria-hidden="true">
          <h1 class="mega first">SCORES</h1>
          <h2 class="mega last">ORIGINAL WORKS</h2>
        </div>

        <img class="hero-person page-person projects-person" src="/assets/img/marco-projects.png" alt="Portrait detoure placeholder de Marco avec violon" />

        <a class="cover-hit nav-home" href="/index.html" data-pjax>
          <strong>HOME</strong>
          <span>COVER <i></i> IDENTITY</span>
        </a>
        <a class="cover-hit nav-music" href="/music.html" data-pjax>
          <strong>VIOLIN</strong>
          <span>LIVE <i></i> RECORDINGS</span>
        </a>
        <a class="cover-hit nav-gallery" href="/gallery.html" data-pjax>
          <strong>MODELE</strong>
          <span>PHOTO <i></i> CASTING</span>
        </a>
        <a class="cover-hit nav-contact" href="/contact.html" data-pjax>
          <strong>CONTACT</strong>
          <span>BOOKING <i></i> COLLABS</span>
        </a>

        <a class="key-project" href="/projects.html" data-pjax aria-label="Page scores">
          <span>CINEMATIC STRINGS</span>
          <span>ORIGINAL SCORE</span>
        </a>

        <div class="cover-tagline" aria-hidden="true">
          <span>FILM MUSIC</span>
          <span>STAGE CAMPAIGNS</span>
        </div>

        <div class="editorial-stack projects-stack" aria-hidden="true">
          <span>CUSTOM MUSIC</span>
          <span>PICTURE / STAGE</span>
          <span>MOTIFS</span>
        </div>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>92 BPM</b><b>LIVE STRINGS</b><b>VIOLIN - SCORE - IMAGE</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js?v=0.5.2"></script>
  <script src="/assets/js/model-page.js?v=0.5.5"></script>
</body>
</html>
