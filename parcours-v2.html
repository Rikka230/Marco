<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Parcours V2</title>
  <meta name="description" content="Version 2 de la page Parcours de Marco Charlas-Hou, pensée comme un carnet artistique pop." />
  <link rel="stylesheet" href="/style.css?v=0.4.9" />
  <link rel="stylesheet" href="/assets/css/model-page.css?v=0.5.5" />
  <link rel="stylesheet" href="/assets/css/marco-bg-veil.css?v=0.5.5" />
  <link rel="stylesheet" href="/assets/css/parcours-v2.css?v=0.6.0" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page inner parcours-v2-page" data-page="parcours-v2" data-bg="scores" data-theme="parcours" data-transition-label="PARCOURS V2" aria-labelledby="parcours-v2-title">
        <div class="photo-bg" aria-hidden="true"></div>
        <div class="parcours-v2-atmosphere" aria-hidden="true"></div>

        <div class="parcours-v2-title-wrap" aria-hidden="true">
          <h1 id="parcours-v2-title">PARCOURS</h1>
          <span>TRAJECTOIRE</span>
        </div>

        <img class="hero-person page-person parcours-v2-person" src="/assets/img/marco-projects.png" alt="Portrait détouré de Marco pour la page Parcours V2" />

        <a class="parcours-v2-back" href="/parcours.html" data-pjax aria-label="Retour à la version 1 de la page Parcours">
          <strong>V1</strong>
          <span>ancienne piste</span>
        </a>

        <aside class="parcours-v2-note" aria-label="Note personnelle">
          <strong>Mon<br />parcours.</strong>
          <p>De la formation à l’expérience, un chemin guidé par la passion et la création.</p>
        </aside>

        <section class="parcours-v2-studies" aria-labelledby="parcours-v2-studies-title">
          <h2 id="parcours-v2-studies-title">Formation / Études</h2>
          <div class="parcours-v2-study-list" data-parcours-v2-studies></div>
        </section>

        <section class="parcours-v2-experiences" aria-labelledby="parcours-v2-experiences-title">
          <h2 id="parcours-v2-experiences-title">Expériences</h2>
          <div class="parcours-v2-experience-list" data-parcours-v2-experiences></div>
        </section>

        <section class="parcours-v2-timeline-zone" aria-labelledby="parcours-v2-timeline-title">
          <h2 id="parcours-v2-timeline-title">Timeline dynamique</h2>
          <div class="parcours-v2-timeline" data-parcours-v2-timeline></div>
        </section>

        <section class="parcours-v2-profile" aria-labelledby="parcours-v2-profile-title">
          <h2 id="parcours-v2-profile-title">Profil</h2>
          <div class="parcours-v2-skill-list" data-parcours-v2-skills></div>
        </section>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>03</b><b>PARCOURS V2</b><b>CARNET ARTISTIQUE</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js"></script>
  <script src="/assets/js/model-page.js?v=0.5.5"></script>
  <script src="/assets/js/parcours-v2.js?v=0.6.0"></script>
</body>
</html>
