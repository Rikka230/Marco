# Reconstruit le site Marco (contenu lu depuis Firestore) et le déploie en prod.
# Déclencheurs :
#  - push sur main (déploiement du code)
#  - repository_dispatch "publish" (bouton "Publier" du back-office via la Cloud Function)
#  - manuel (onglet Actions)
name: Deploy site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # En local public/assets est une jonction vers assets/ (ignorée par git).
      # Sur le runner Linux on recrée ce dossier depuis assets/ (suivi) pour que
      # le build serve images, audio et CSS de page aux mêmes URLs /assets/...
      - name: Prepare public/assets
        run: mkdir -p public && cp -r assets public/assets

      - name: Build (lecture Firestore)
        run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}

      # Action officielle Firebase : gère l'auth via le service account.
      - name: Deploy hosting:site (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: marco-site
          target: site
          channelId: live
