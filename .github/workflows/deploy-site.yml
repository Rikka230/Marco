# Reconstruit le site Marco (lecture du contenu depuis Firestore) et le deploie.
# Declencheurs :
#  - push sur la branche de prod (deploiement code)
#  - repository_dispatch type "publish" (bouton "Publier" du back-office, via le Worker)
#  - manuel (bouton "Run workflow" dans l'onglet Actions)
name: Deploy site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [publish]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Le build lit Firestore via le service account (contenu publie le plus recent).
      - name: Build
        run: npm run build
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting (site public)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: marco-site
          channelId: live
          target: site
