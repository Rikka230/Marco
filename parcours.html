<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Parcours</title>
  <meta name="description" content="Parcours, études, expériences professionnelles et compétences artistiques de Marco Charlas-Hou." />
  <link rel="stylesheet" href="/style.css?v=0.4.9" />
  <link rel="stylesheet" href="/assets/css/model-page.css?v=0.5.5" />
  <link rel="stylesheet" href="/assets/css/marco-bg-veil.css?v=0.5.5" />
  <link rel="stylesheet" href="/assets/css/parcours-page.css?v=0.5.8" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page inner parcours-page parcours-rebuild" data-page="parcours" data-bg="scores" data-theme="parcours" data-transition-label="PARCOURS" aria-labelledby="parcours-title">
        <div class="photo-bg" aria-hidden="true"></div>
        <div class="parcours-atmosphere" aria-hidden="true"></div>

        <div class="title-wrap parcours-title-wrap" aria-hidden="true">
          <h1 id="parcours-title" class="mega first">PARCOURS</h1>
          <h2 class="mega last">TRAJECTOIRE</h2>
        </div>

        <img class="hero-person page-person projects-person parcours-person" src="/assets/img/marco-projects.png" alt="Portrait détouré de Marco pour la page Parcours" />

        <div class="parcours-copy" aria-label="Positionnement du parcours">
          <span>Mon parcours.</span>
          <p>De la formation à l’expérience, un chemin guidé par la passion et la création.</p>
        </div>

        <section class="parcours-zone parcours-studies" aria-labelledby="parcours-studies-title">
          <header>
            <span>01</span>
            <h2 id="parcours-studies-title">Formation / Études</h2>
          </header>
          <div class="parcours-study-list" data-parcours-studies></div>
        </section>

        <section class="parcours-timeline-zone" aria-labelledby="parcours-timeline-title">
          <header>
            <span>timeline dynamique</span>
            <h2 id="parcours-timeline-title">De la formation à l’expérience</h2>
          </header>
          <div class="parcours-timeline" data-parcours-timeline></div>
        </section>

        <section class="parcours-zone parcours-experiences" aria-labelledby="parcours-experiences-title">
          <header>
            <span>02</span>
            <h2 id="parcours-experiences-title">Expériences</h2>
          </header>
          <div class="parcours-experience-list" data-parcours-experiences></div>
        </section>

        <section class="parcours-skills" aria-labelledby="parcours-skills-title">
          <h2 id="parcours-skills-title">Profil</h2>
          <div class="parcours-skill-list" data-parcours-skills></div>
        </section>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>03</b><b>PARCOURS ARTISTIQUE</b><b>ÉTUDES · EXPÉRIENCES · COMPÉTENCES</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js"></script>
  <script src="/assets/js/model-page.js?v=0.5.5"></script>
  <script src="/assets/js/parcours-page.js?v=0.5.8"></script>
</body>
</html>
