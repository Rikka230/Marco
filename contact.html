<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Contact</title>
  <meta name="description" content="Booking, collaborations, press kit et contact professionnel de Marco Charlas-Hou." />
  <link rel="stylesheet" href="/style.css?v=0.5.0" />
  <link rel="stylesheet" href="/assets/css/model-page.css?v=0.5.5" />
  <link rel="stylesheet" href="/assets/css/marco-bg-veil.css?v=0.5.5" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page inner booking" data-page="booking" data-bg="booking" data-theme="contact" data-transition-label="BOOKING">
        <div class="photo-bg" aria-hidden="true"></div>
        <div class="press-lines" aria-hidden="true"></div>

        <div class="title-wrap" aria-hidden="true">
          <h1 class="mega first">BOOKING</h1>
          <h2 class="mega last">CONTACT PRO</h2>
        </div>

        <img class="hero-person page-person contact-person" src="/assets/img/marco-contact.png" alt="Portrait detoure placeholder de Marco avec violon" />

        <a class="cover-hit nav-home" href="/index.html" data-pjax>
          <strong>HOME</strong>
          <span>COVER <i></i> IDENTITY</span>
        </a>
        <a class="cover-hit nav-music" href="/music.html" data-pjax>
          <strong>VIOLIN</strong>
          <span>LIVE <i></i> RECORDINGS</span>
        </a>
        <a class="cover-hit nav-projects" href="/projects.html" data-pjax>
          <strong>SCORES</strong>
          <span>FILM <i></i> STAGE</span>
        </a>
        <a class="cover-hit nav-gallery" href="/gallery.html" data-pjax>
          <strong>MODELE</strong>
          <span>PHOTO <i></i> CASTING</span>
        </a>

        <a class="key-project" href="/contact.html" data-pjax aria-label="Contact professionnel">
          <span>BOOKING</span>
          <span>COLLABORATIONS</span>
        </a>

        <div class="cover-tagline" aria-hidden="true">
          <span>VIOLIN / SCORE / IMAGE</span>
          <span>CONTACT PRO</span>
        </div>

        <form class="contact-form" data-contact-form>
          <div class="contact-field">
            <label for="contact-name">Nom</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required />
          </div>

          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required />
          </div>

          <fieldset class="request-type">
            <legend>Type de demande</legend>
            <label>
              <input type="radio" name="request_type" value="Booking" checked />
              <span>Booking</span>
            </label>
            <label>
              <input type="radio" name="request_type" value="Collaboration" />
              <span>Collaboration</span>
            </label>
            <label>
              <input type="radio" name="request_type" value="Score / Composition" />
              <span>Score / Composition</span>
            </label>
            <label>
              <input type="radio" name="request_type" value="Image / Acting / Model" />
              <span>Image / Acting / Model</span>
            </label>
          </fieldset>

          <div class="contact-field contact-field-wide">
            <label for="contact-subject">Sujet</label>
            <input id="contact-subject" name="subject" type="text" required />
          </div>

          <div class="contact-field contact-field-wide">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="3" required></textarea>
          </div>

          <button class="contact-submit" type="submit">SEND REQUEST</button>
          <p class="contact-status" data-form-status aria-live="polite"></p>
        </form>

        <div class="editorial-stack contact-stack" aria-hidden="true">
          <span>VIOLINIST</span>
          <span>COMPOSER</span>
          <span>ACTOR</span>
          <span>MODEL</span>
        </div>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>92 BPM</b><b>LIVE STRINGS</b><b>VIOLIN - SCORE - IMAGE</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js?v=0.5.2"></script>
  <script src="/assets/js/model-page.js?v=0.5.5"></script>
</body>
</html>
