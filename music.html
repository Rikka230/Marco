<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Violin</title>
  <meta name="description" content="Violon, performances live, enregistrements et sessions de Marco Charlas-Hou." />
  <link rel="stylesheet" href="/style.css?v=0.4.5" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page inner music" data-page="music" data-bg="music" data-theme="music" data-transition-label="VIOLIN">
        <div class="photo-bg" aria-hidden="true"></div>
        <div class="string-lines" aria-hidden="true"></div>

        <div class="title-wrap" aria-hidden="true">
          <h1 class="mega first">VIOLIN</h1>
          <h2 class="mega last">LIVE STRINGS</h2>
        </div>

        <img class="hero-person page-person music-person" src="/assets/img/marco-music.png" alt="Portrait detoure placeholder de Marco avec violon" />

        <a class="cover-hit nav-home" href="/index.html" data-pjax>
          <strong>HOME</strong>
          <span>COVER <i></i> IDENTITY</span>
        </a>
        <a class="cover-hit nav-projects" href="/projects.html" data-pjax>
          <strong>SCORES</strong>
          <span>FILM <i></i> STAGE</span>
        </a>
        <a class="cover-hit nav-gallery" href="/gallery.html" data-pjax>
          <strong>IMAGE</strong>
          <span>ACTING <i></i> MODEL</span>
        </a>
        <a class="cover-hit nav-contact" href="/contact.html" data-pjax>
          <strong>CONTACT</strong>
          <span>BOOKING <i></i> COLLABS</span>
        </a>

        <a class="key-project" href="/music.html" data-pjax aria-label="Page musique">
          <span>LIVE SESSIONS</span>
          <span>RECORDINGS</span>
        </a>

        <div class="cover-tagline" aria-hidden="true">
          <span>BOWED TEXTURES</span>
          <span>STRING LANGUAGE</span>
        </div>

        <div class="editorial-stack music-stack" aria-hidden="true">
          <span>ORIGINALS</span>
          <span>SESSIONS</span>
          <span>SOLO / ENSEMBLE</span>
        </div>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>92 BPM</b><b>LIVE STRINGS</b><b>VIOLIN - SCORE - IMAGE</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
