<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Violoniste Compositeur</title>
  <meta name="description" content="Prototype cover interactive pour Marco Charlas-Hou, violoniste, compositeur, acteur et modele." />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/assets/css/model-page.css?v=0.5.2" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page home" data-page="home" data-bg="home" data-theme="home" data-transition-label="MARCO">
        <div class="photo-bg" aria-hidden="true"></div>

        <div class="title-wrap" aria-hidden="true">
          <h1 class="mega first">MARCO</h1>
        </div>

        <h2 class="mega last cover-signature" aria-hidden="true">CHARLAS-HOU</h2>

        <img class="hero-person" src="/assets/img/marco-home.png" alt="Portrait detoure placeholder de Marco avec violon" />

        <a class="cover-hit left-a" href="/music.html" data-pjax>
          <strong>VIOLIN</strong>
          <span>LIVE <i></i> RECORDINGS</span>
        </a>
        <a class="cover-hit left-b" href="/projects.html" data-pjax>
          <strong>SCORES</strong>
          <span>FILM <i></i> STAGE</span>
        </a>
        <a class="cover-hit right-a" href="/gallery.html" data-pjax>
          <strong>MODELE</strong>
          <span>PHOTO <i></i> CASTING</span>
        </a>
        <a class="cover-hit right-b" href="/contact.html" data-pjax>
          <strong>CONTACT</strong>
          <span>BOOKING <i></i> COLLABS</span>
        </a>

        <a class="key-project" href="/projects.html" data-pjax aria-label="Voir les scores originaux">
          <span>CINEMATIC STRINGS</span>
          <span>ORIGINAL SCORE</span>
        </a>

        <div class="cover-tagline" aria-hidden="true">
          <span>VIOLINIST COMPOSER</span>
          <span>ACTOR MODEL</span>
        </div>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>92 BPM</b><b>LIVE STRINGS</b><b>VIOLIN - SCORE - IMAGE</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js"></script>
  <script src="/assets/js/model-page.js?v=0.5.2"></script>
</body>
</html>
