<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marco Charlas-Hou - Image</title>
  <meta name="description" content="Image, acting, modele, portraits et direction visuelle de Marco Charlas-Hou." />
  <link rel="stylesheet" href="/style.css?v=0.4.4" />
</head>
<body>
  <div class="film-grain" aria-hidden="true"></div>
  <div class="shell">
    <a class="mini-brand" href="/index.html" data-pjax aria-label="Retour accueil"><span></span>MARCO CHARLAS-HOU</a>

    <main id="app">
      <section class="page poster-page inner gallery" data-page="gallery" data-bg="gallery" data-theme="gallery" data-transition-label="IMAGE">
        <div class="photo-bg" aria-hidden="true"></div>
        <div class="contact-sheet" aria-hidden="true"></div>

        <div class="title-wrap" aria-hidden="true">
          <h1 class="mega first">IMAGE</h1>
          <h2 class="mega last">PORTRAITS</h2>
        </div>

        <img class="hero-person page-person gallery-person" src="/assets/img/marco-gallery.png" alt="Portrait detoure placeholder de Marco avec violon" />

        <a class="cover-hit nav-home" href="/index.html" data-pjax>
          <strong>HOME</strong>
          <span>COVER <i></i> IDENTITY</span>
        </a>
        <a class="cover-hit nav-music" href="/music.html" data-pjax>
          <strong>VIOLIN</strong>
          <span>LIVE <i></i> RECORDINGS</span>
        </a>
        <a class="cover-hit nav-projects" href="/projects.html" data-pjax>
          <strong>SCORES</strong>
          <span>FILM <i></i> STAGE</span>
        </a>
        <a class="cover-hit nav-contact" href="/contact.html" data-pjax>
          <strong>CONTACT</strong>
          <span>BOOKING <i></i> COLLABS</span>
        </a>

        <a class="key-project" href="/gallery.html" data-pjax aria-label="Page image">
          <span>ACTING MODEL</span>
          <span>EDITORIAL IMAGE</span>
        </a>

        <div class="cover-tagline" aria-hidden="true">
          <span>PORTRAITS</span>
          <span>VISUAL IDENTITY</span>
        </div>

        <div class="editorial-stack gallery-stack" aria-hidden="true">
          <span>CONTACT SHEET</span>
          <span>FRAME / FACE</span>
          <span>PRESS VISUALS</span>
        </div>
      </section>
    </main>

    <canvas id="dotWave" aria-hidden="true"></canvas>
    <div class="mini-player">
      <button id="playBtn" type="button" aria-label="Lancer la boucle audio">PLAY</button>
      <span class="track-label"><b>92 BPM</b><b>LIVE STRINGS</b><b>VIOLIN - SCORE - IMAGE</b></span>
      <audio id="audioLoop" src="/assets/audio/soft-loop.wav" preload="auto" loop></audio>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
